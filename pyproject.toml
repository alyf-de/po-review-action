[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "po-review-action"
dynamic = ["version"]
description = "GitHub Action that posts review summaries for gettext .po translation pull requests"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "Babel>=2.14,<3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.44",
]

[tool.setuptools]
packages = []

[tool.uv]
exclude-newer = "7 days"
